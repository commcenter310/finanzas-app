<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF3FA" />
    <title>Finni Apoyo</title>
    <meta name="description" content="Control de finanzas personales: gastos, ingresos, presupuestos, deudas y proyecciones." />
    <!-- Vista previa al compartir el enlace (WhatsApp, redes, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Finni Apoyo" />
    <meta property="og:description" content="Tu dinero, con dirección: gastos, ingresos, presupuestos, deudas y proyecciones." />
    <meta property="og:url" content="https://finanzas-app-eight-delta.vercel.app/" />
    <meta property="og:image" content="https://finanzas-app-eight-delta.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Aplica el tema ANTES del primer pintado para evitar el flash blanco.
      // Preferencia guardada > preferencia del sistema.
      (function () {
        var t = localStorage.getItem('finni-theme')
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (t === 'dark') document.documentElement.dataset.theme = 'dark'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.content = t === 'dark' ? '#080C14' : '#EEF3FA'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
